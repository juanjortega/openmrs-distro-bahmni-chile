name: Build and Publish OpenMRS
on:
  push:
    branches:
      - master
      - 'release-*'
      - release/chile
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build-publish-docker-helm:
    name: Build & Publish Docker Image & Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # leer los omod de Chile y publicar la imagen en ghcr.io/juanjortega
    env:
      HELM_CHART_PATH: package/helm/openmrs
    steps:
      - uses: actions/checkout@v2
      # Se calcula aqui en vez de descargar y ejecutar en cada build el
      # setArtifactVersion.sh de Bahmni/bahmni-infra-utils. Ese script consulta la
      # API de tags SIN autenticar y, en un repositorio privado, GitHub responde
      # {"message":"Not Found"}: jq falla al indexarlo y el job muere antes de
      # construir nada ("Cannot index string with string name"). De paso deja de
      # depender en tiempo de build de un script de otra organizacion.
      #
      # Se conserva el formato que producia: el nombre del tag cuando hay tag, y
      # <package/.appversion>-<numero de ejecucion> cuando es una rama.
      #
      # No se replica su verifyReleaseVersion (abortar si la version ya estaba
      # publicada): en rama el numero de ejecucion ya hace unica cada etiqueta, y
      # en tag es git quien impide repetir el nombre.
      - name: Set env.ARTIFACT_VERSION
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(cat package/.appversion)-${GITHUB_RUN_NUMBER}"
          fi
          echo "Setting version $version"
          echo "ARTIFACT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Los modulos de Chile viven en GitHub Packages, que sirve por repositorio y exige
      # credenciales aunque no haya nada publico. Hay un <server> por cada <repository>
      # del distro/pom.xml, con el mismo <id>.
      #
      # QUE TOKEN USA Y POR QUE
      # El GITHUB_TOKEN de un workflow esta acotado a SU repositorio, asi que no ve los
      # paquetes de los otros seis. Se puede resolver de dos formas:
      #
      #   a) Conceder lectura a este repositorio en cada paquete ("Manage Actions access").
      #      Es por PAQUETE, no por repositorio, y solo bahmni-core publica 11 (bahmnicore-omod,
      #      bahmnicore-api, bahmni-emr-api, reference-data-api, admin...): son mas de veinte
      #      en total, y habria que repetirlo con cada modulo nuevo.
      #
      #   b) Un token con `read:packages` en el secreto GH_PACKAGES_TOKEN. Uno solo, y cubre
      #      lo que venga. Conviene que sea de alcance fino: solo lectura de paquetes, solo
      #      esta organizacion y con caducidad.
      #
      # Se prefiere (b) por la cantidad de paquetes, pero (a) sigue funcionando: si el
      # secreto no esta definido se cae al GITHUB_TOKEN y bastara con los permisos por
      # paquete que haya concedidos.
      - name: Credenciales de GitHub Packages
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Sin GH_PACKAGES_TOKEN: se usa el GITHUB_TOKEN del workflow."
            echo "Solo funcionara si cada paquete concede lectura a este repositorio."
            GH_TOKEN="${GITHUB_TOKEN_FALLBACK}"
          else
            echo "Usando GH_PACKAGES_TOKEN."
          fi
          mkdir -p ~/.m2
          {
            echo '<settings><servers>'
            for id in ghp-bahmni-core-chile ghp-appointments-chile ghp-oauth2login                       ghp-eis-identity ghp-interconsulta ghp-provider-signature; do
              echo "  <server><id>${id}</id><username>${GH_ACTOR}</username><password>${GH_TOKEN}</password></server>"
            done
            echo '</servers></settings>'
          } > ~/.m2/settings.xml
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven
        run: |
          ./mvnw --no-transfer-progress -U clean install
        env:
          USER_NAME: ${{ secrets.USERNAME }}
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # La imagen va a GitHub Packages de juanjortega (ghcr.io/juanjortega/openmrs-chile), el mismo
      # dueno que los modulos: el GITHUB_TOKEN del workflow basta para publicarla y no hace falta
      # ninguna cuenta de otro registro. Solo amd64: es lo que corre en los servidores, y el build de
      # arm64 bajo QEMU duplicaba el tiempo.
      - name: Login a ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64
          file: package/docker/openmrs/Dockerfile
          push: true
          tags: |
            ghcr.io/juanjortega/openmrs-chile:${{ env.ARTIFACT_VERSION }}
            ghcr.io/juanjortega/openmrs-chile:latest
          # Etiquetas OCI: la imagen se describe a si misma. Sin esto, saber de que
          # commit sale una imagen publicada exige adivinar por fechas. `revision` es
          # lo que permite sacar el merge-base contra el upstream y medir la divergencia.
          labels: |
            org.opencontainers.image.title=openmrs-chile
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.ARTIFACT_VERSION }}
      # Sin chart de Helm: la imagen se despliega con docker compose, y el chart se publicaba en un
      # registro ajeno.
